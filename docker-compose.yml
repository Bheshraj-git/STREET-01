services:
  postgres:
    image: postgres:16-alpine
    container_name: street01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: street01
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: street01
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
